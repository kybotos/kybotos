# scripts/metronome-demo.conf — metronome の操作をひととおり実機に注入して見せる(Phase 22b ステップ 5)。
#
#   ./scripts/device-regress.sh --conf scripts/metronome-demo.conf --task <タスク名>
#
# 回帰の conf(device-regress.conf)を読み、metronome だけを 1 回、長いシナリオで回す。カメラで録りながら流し、
# 見た目と音を確かめるためのもの(docs/workflow.md §3.3 の「操作はシリアルコンソールから注入してよい」)。
# 手順の時刻はモニタのログ(KBCMD 行)で追える。
# **BPM のシャトルで指を止めたまま変わり続けることは、注入の drag(動かしてすぐ離す)では試せない**(人の操作で見る)。
# 前提のレイアウト(wasm-apps/metronome/src/lib.rs): ▶ / ■ = (300, 38)、BPM = 本体の左(100, 110)、拍子 = 本体の右(270, 110)、
# 拍子は 16px で 1 段(左右 = 分子、上へ = 細かい音価)。
# **ドラッグは画面の内側(x 0〜319)で終えること**。外に出ると実機の LVGL は押下を失った扱いにして UP を出さない
# (アプリのジェスチャが離されないまま残る。Linux のホストは外の座標もそのまま渡すので起きない)。
# 期待する拍子の並び: 4/4 → 6/4 → 6/8 → 7/8 → 12/8 → 12/16 → 16/16 → 11/16 → 11/4。
. "$(dirname "${BASH_SOURCE[0]}")/device-regress.conf"

APPS="metronome"
REPEAT_OVERRIDE[metronome]=1
SCENARIO[metronome]="expect 120bpm; wait 2; \
tap 300 38; expect \xef\x81\x8d; wait 6; \
drag 100 110 100 0 800; drag 100 110 100 0 800; drag 100 110 100 0 800; wait 4; \
drag 225 110 32 0 800; wait 4; \
drag 225 110 0 -16 800; wait 5; \
drag 225 110 16 0 800; wait 5; \
drag 225 110 80 0 800; wait 5; \
drag 225 110 0 -16 800; wait 4; \
drag 225 110 64 0 800; wait 5; \
drag 310 110 -80 0 800; drag 225 110 0 32 800; wait 4; \
tap 300 38; expect \xef\x81\x8b; wait 2"
