# scripts/metronome-demo.conf — metronome の操作をひととおり実機に注入して見せる(Phase 22b ステップ 5)。
#
#   ./scripts/device-regress.sh --conf scripts/metronome-demo.conf --task <タスク名>
#
# 回帰の conf(device-regress.conf)を読み、metronome だけを 1 回、長いシナリオで回す。カメラで録りながら流し、
# 見た目と音を確かめるためのもの(docs/workflow.md §3.3 の「操作はシリアルコンソールから注入してよい」)。
# 手順の時刻はモニタのログ(KBCMD 行)で追える。
# 前提のレイアウト(wasm-apps/metronome/src/lib.rs): ▶ / ■ = (300, 38)、BPM = 本体の左(100, 110)、
# 分子 = 本体の右の線より上(270, 85)、分母 = 線より下(270, 150)。上下に「はじく」と離したときに変わる(上 = 大きく)。
# はじき 1 回で ±1(拍子は 1 段)。BPM の押したままの連続変更(±5 → ±10)は注入の drag では起きない。拍子もヘッダに出るので `expect` で確かめる。
# **ドラッグは画面の内側(x 0〜319)で終えること**。外に出ると実機の LVGL は押下を失った扱いにして UP を出さない
# (アプリのジェスチャが離されないまま残る。Linux のホストは外の座標もそのまま渡すので起きない)。
# 期待する拍子の並び: 4/4 → 5/4 → 6/4 → 6/8 → 7/8 → 7/16 → 6/16 → 5/16 → 5/8 → 5/4。
. "$(dirname "${BASH_SOURCE[0]}")/device-regress.conf"

APPS="metronome"
REPEAT_OVERRIDE[metronome]=1
SCENARIO[metronome]="expect 120bpm; expect 4/4; wait 2; \
tap 300 38; expect \xef\x81\x8d; wait 6; \
drag 100 110 0 -36 0; expect 121bpm; drag 100 110 0 -36 0; expect 122bpm; drag 100 110 0 -36 0; expect 123bpm; wait 3; \
drag 100 180 0 -170 0; expect 124bpm; wait 4; drag 100 60 0 160 0; expect 123bpm; wait 3; \
drag 270 85 0 -36 0; expect 5/4; drag 270 85 0 -36 0; expect 6/4; wait 4; \
drag 270 150 0 -36 0; expect 6/8; wait 5; \
drag 270 85 0 -36 0; expect 7/8; wait 5; \
drag 270 150 0 -36 0; expect 7/16; wait 4; \
drag 270 85 0 36 0; expect 6/16; drag 270 85 0 36 0; expect 5/16; wait 4; \
drag 270 150 0 36 0; expect 5/8; drag 270 150 0 36 0; expect 5/4; wait 4; \
tap 300 38; expect \xef\x81\x8b; wait 2"
