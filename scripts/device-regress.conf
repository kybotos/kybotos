# scripts/device-regress.sh の設定(bash として source される)。

# 回帰対象。Phase 12 作業 2 で 6 本に絞り(判断根拠は docs/results/phase12.md)、
# Phase 14 で clicktest を削除して 5 本(判断根拠は docs/results/phase14.md)。
# Phase 18 で sequencer を足して 6 本にしたが、sequencer を非公開の app-sequencer へ移したので
# 5 本に戻した(docs/results/repo-split.md)。
APPS="touch_demo mp3player metronome midi_loopback seq_smoke"

# Linux の回帰(linux-regress.sh)で使う `.wasm` のパスの上書き。無ければ wasm-apps/<app>/<app>.wasm。
# この repo の外のアプリを足すときは、この conf を source した別の conf で
#   APPS="$APPS <app>"; APP_WASM[<app>]=/path/to/<app>.wasm
# のように足し、device-regress.sh / linux-regress.sh に --conf で渡す(実機は KYBOTOS_EXTRA_APPS で
# 埋め込んだファームが要る。src/components/wasm_runtime/CMakeLists.txt)。
declare -A APP_WASM=()

# 起動から stop を送るまでの保持秒数(既定)。
HOLD_SEC=6

# アプリごとの保持秒数の上書き。seq_smoke は 8 小節の自己検査を一巡させる。
declare -A HOLD_OVERRIDE=(
    [seq_smoke]=60  # Phase 17 で clear / 枯渇 / 再開 / 境界停止の検査を追加し約 30 秒延びた
)

# 同じアプリの反復回数(U-2、Phase 18)。各回の差分 +0 に加え、N 回の終了時の
# free_int / free_psram がすべて同じことを要求する(開始値が回を追って下がる漏れを捕まえる)。
REPEAT_RUNS=3
# seq_smoke は 1 回 60 秒かかるので繰り返さない
declare -A REPEAT_OVERRIDE=(
    [seq_smoke]=1
)

# 許容する WARN/ERROR 行(1 行 1 正規表現)。ここに当たらない W/E 行は不合格。
# - I2C の nack はボードリセット直後の既知ノイズ(Touch online より前)。
# - ring buffer full は MIDI ループバック配線をしているときだけ出る。
# 注: Phase 11 まで許容していた "spi_flash: Detected size(16384k) larger than ..." は
#     Phase 12 作業 1(フラッシュサイズ 16MB 化)で出なくなったので不要。
ALLOW_PATTERNS=(
    'I2C transaction unexpected nack detected'
    'MIDI RX: ring buffer full'
)

# アプリごとの許容 free heap 差分(終了 - 開始)。指定が無ければ 0 を要求する。
#
# mp3player の既知の -44B について: Phase 12 作業 3 で、これは **MP3 を実際に再生した
# ときだけ**現れることを実測した(無操作で 35 秒保持しても +0。手動回帰で -44 が出て
# いたのは、実行中にユーザーが再生ボタンをタップしていたため)。本スクリプトは
# アプリ内 UI 操作を行わない(v1 のスコープ外)ので、全アプリ 0 を要求する。
# **再生経路まで含めた回帰が要るときは、docs/workflow.md §3.3 の人間操作+カメラで
# 実施すること。** そこでは mp3player に -44B が出るのが正常。
declare -A EXPECT_DELTA=()

# --- 余裕の監視: 下限しきい値 ------------------------------------------------
#
# **固定値一致にしない**(Phase 15)。largest_int はアプリごとに違いうる
# (linear memory は PSRAM へ出たが、.wasm バッファやアプリ固有の native 確保は
# internal に残る)。単一の期待値を全アプリに当てると「毎回 FAIL だが実は PASS」を
# 別の形で作り直すことになる。厳密な一致を見たいのはリーク検出の方で、それは
# 下の差分で見る。この 2 つを混ぜていたのが Phase 14 までの設計の弱点だった。
#
# 実測(Phase 15 ステップ 2。PSRAM 有効 / CAPS_ALLOC / psram_dma_direct=1):
#   free_int 105,880 / largest_int 57,344 / free_psram 8,316,904(5 アプリとも同一)
#
# **Phase 18c と Phase 19 で基準値が 2 回下がっている**(どちらも WAMR プールの拡大で、
# internal の静的がそのぶん増えたため。プールは `s_wamr_heap` = BSS):
#   Phase 15    free_int 105,880 / largest_int 57,344
#   Phase 18c   free_int  89,368 / largest_int 40,960(プール 48KB → 64KB)
#   Phase 19    free_int  73,052 / largest_int 31,744(プール 64KB → 80KB)
#   **Phase 19b free_int  56,316 / largest_int 31,744(プール 80KB → 96KB、ユーザー承認済み)**
#     同時に U-6(`.wasm` バッファを PSRAM へ)を実施したので、**実行中**の free_int は逆に増えた
#     (45,968 → 56,212)。ここで見ているのは**停止時**の値なので、プール静的 +16KB ぶんだけ下がる。
#     largest_int は 31,744 のまま動かなかった。
#   **Phase 21  free_int 154,520 / largest_int 106,496(プールを PSRAM へ、ユーザー承認済み)**
#     プールの大きさは 112KB のまま、確保先だけを internal の静的 BSS から PSRAM へ移した
#     (`heap_caps_aligned_alloc(16, …, MALLOC_CAP_SPIRAM)`)。**internal の静的が 112KB まるごと戻り**、
#     基準値は Phase 15 より上(free_int 105,880 / largest_int 57,344)になった。
#     **ここで初めてしきい値が上がる。** 同一ファームでの A/B(PHASE21-TEMP で internal に戻して計測)は
#     **free_int 39,796 / largest_int 15,360** で Phase 20 の基準値を再現し、
#     **`app_tick` は avg 1,391µs(internal)→ 1,387µs(PSRAM)で悪化なし**だった。
#     **`free_psram` は 8,316,904 → 8,202,204**(プールぶん −114,700)。`MIN_FREE_PSRAM` は
#     8,000,000 のままで 202KB の余裕があるので**下げない**(Phase 21a でプールを増やすときに見直す)。
#   **Phase 20  free_int  39,900 / largest_int 15,360(プール 96KB → 112KB、ユーザー承認済み)**
#     永続化(Save / Load)で `.wasm` が 39,383 B になり、96KB では instantiate が
#     「allocate memory failed」で落ちた(実測 highmark 101,384)。**104KB では
#     `create_exec_env failed`** なので 112KB が最小。**ここで largest_int が半減した**
#     (31,744 → 15,360。16KB の静的が DRAM バンクの境界をまたいだため)。
#     全 6 本の回帰は free_int 差分 +0 / 警告 0 件で動作しており、下がったのは余裕だけ。
# しきい値は**新しい基準値から 8KB ほど下**に置き直した(基準値そのものに張り付けると、
# 平常の揺れで毎回 FAIL になる)。**次にプールを触るときはここも一緒に見直すこと。**
MIN_FREE_INT=146000
MIN_LARGEST_INT=98304
MIN_FREE_PSRAM=8000000

# --- リーク検出: 開始と終了の差分 --------------------------------------------
#
# PSRAM は 8MB あるので、下限しきい値より差分の方が実質的な監視になる。
# WASM の linear memory は PSRAM から取られる(Phase 15)ので、ここを見ないと
# アプリの load/unload を繰り返したときの PSRAM リークに気づけない。
declare -A EXPECT_DELTA_PSRAM=()
